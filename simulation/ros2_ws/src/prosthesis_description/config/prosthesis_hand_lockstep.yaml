# SIMPLIFIED BENCH: not calibrated hardware mechanics.
controller_manager:
  ros__parameters:
    update_rate: 1000
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    fw_hand_controller:
      type: npulse_sim_control/LockstepHandController
joint_state_broadcaster:
  ros__parameters: {}
fw_hand_controller:
  ros__parameters:
    automatic_test: true
    automatic_test_limit: 15
    test_csv_directory: "/home/margaux/ARM-SOFT-sim-new/results/hand-feedback"
    preserve_others: true
    command_timeout_s: 0.5
    coupling_stiffness: 0.3
    coupling_damping: 0.001
    nm_per_percent: [0.005, 0.005, 0.005, 0.005, 0.005, 0.01, 0.01, 0.005]
    joint_limits: [2.0, 2.0, 3.0, 2.0, 2.0, 3.0, 2.0, 2.0, 3.0, 2.0, 2.0, 3.0, 2.0, 2.0, 5.0, 5.0, 3.0]
    joints:
      - joint_thumb_2
      - joint_thumb_3
      - joint_index_1
      - joint_index_2
      - joint_index_3
      - joint_middle_1
      - joint_middle_2
      - joint_middle_3
      - joint_ring_1
      - joint_ring_2
      - joint_ring_3
      - joint_little_1
      - joint_little_2
      - joint_little_3
      - joint_wrist_x
      - joint_wrist_y
      - joint_thumb_1_x
