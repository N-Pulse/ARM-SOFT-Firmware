syntax = "proto3";
import "protocol_messages.proto";
// Wire-compatible extensions of the existing commissioning envelopes.
// Legacy field numbers and nested message definitions must not change.
// lifecycle_protocol.c handles the new fields; generated legacy code handles 1..5.
message LifecycleDeviceMessage {
  oneof message {
    Hello hello = 1;
    Data data = 2;
    CommissionCommand commission = 3;
    StopRequest stop = 4;
    DiagnosticRequest diagnostic = 5;
    LifecycleControl control = 6;
  }
}
message LifecycleControl {
  enum Command { UNSPECIFIED = 0; ALLOW_START = 1; DENY_START = 2; STOP = 3;
    RESTART = 4; PING = 5; PONG = 6; QUERY = 7; ESTOP = 8; }
  Command command = 1;
  uint32 request_id = 2; // Nonzero, increasing for host commands; echo PING ID for PONG.
  uint32 peer_id = 3; // Must match the Hello device_id.
}
message LifecycleProsthesisMessage {
  oneof message {
    Config config = 1;
    Error error = 2;
    MotorDiagnostic diagnostic = 3;
    CommandReply reply = 4;
    LifecycleStatus status = 5;
    SafetyEvent safety = 6;
    LifecycleControl control = 7;
    Hello hello = 8;
  }
}
message LifecycleStatus {
  enum State { INIT_HANDSHAKE = 0; INIT_MODULES = 1; INIT_RETURN = 2;
    READY = 3; WORK_WAIT = 4; WORK_EXECUTING = 5; STOPPING = 6;
    STOPPED = 7; FAULT = 8; }
  State state = 1;
  uint32 result = 2;
  uint32 request_id = 3;
  uint32 queue_depth = 4;
  uint32 dropped = 5;
  uint32 stop_causes = 6;
  uint32 action_sequence = 7;
  bool action_done = 8;
  uint32 detail = 9;
}
message SafetyEvent {
  uint32 time_ms = 1;
  uint32 cause = 2;
  uint32 motor_mask = 3;
  uint32 stop_epoch = 4;
  uint32 previous_state = 5;
}
